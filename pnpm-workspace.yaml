# node_modules plano, sin enlaces simbolicos.
#
# `sharp` carga `libvips-cpp.so` por el RPATH de su binario nativo, que apunta a
# `$ORIGIN/../../sharp-libvips-linux-x64/lib`. En el diseño aislado de pnpm ese
# tramo es un enlace simbolico dentro de `.pnpm`, y el empaquetador de Vercel no
# lo sigue: el 2026-08-27 el despliegue de staging fallo con "The framework
# produced an invalid deployment package for a Serverless Function. Typically
# this means that the framework produces files in symlinked directories".
#
# Con el diseño plano las dos rutas son directorios reales, el enlazador
# dinamico encuentra la libreria y el paquete de la funcion queda valido. Va
# junto con el `outputFileTracingIncludes` de next.config.mjs, que es lo que
# mete el .so en la funcion: el rastreo de Next no lo ve porque ningun `require`
# lo pide.
#
# A cambio se pierde la proteccion contra dependencias fantasma: un `import` de
# un paquete no declarado en package.json ahora resuelve. Si aparece uno, se
# declara.
nodeLinker: hoisted
allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
auditConfig:
  ignoreGhsas:
    # brace-expansion, solo alcanzable a través de ESLint. Forzar la versión 5
    # dentro de minimatch 3 rompe el lint.
    - GHSA-mh99-v99m-4gvg
    # image-size: denegación de servicio al analizar ICNS, JXL y HEIF.
    # Sin corrección publicada: el aviso pide >=2.0.3 y la última versión es
    # 2.0.2. Llega de forma transitiva por payload@3.86.0, que la usa para leer
    # las dimensiones de una imagen subida. Explotarla exige una cuenta con
    # acceso al CMS que suba un archivo preparado; no hay carga pública de
    # imágenes. Revisar en cada actualización de Payload.
    - GHSA-5p2g-fcmc-qvqq
    - GHSA-w3rx-r6r6-pgpr
overrides:
  'postcss@<=8.5.17': 8.5.23
  'sharp@<0.35.0': 0.35.3
  # Vulnerabilidades altas que llegan de forma transitiva por Payload, Next y
  # Prisma. Se fuerzan las versiones parcheadas y se verifica con build, suite
  # completa e integración.
  #
  # `image-size` queda fuera a propósito: el aviso pide >=2.0.3 y esa versión
  # todavía no está publicada (la última es 2.0.2). Ver docs/operations/deploy.md.
  'undici@<7.29.0': '>=7.29.0'
  'fast-uri@<3.1.5': '>=3.1.5'
  'js-yaml@>=4.0.0 <4.3.1': '>=4.3.1'
  'nanoid@<3.3.18': '>=3.3.18'
  'deepmerge-ts@<8.0.0': '>=8.0.0'
