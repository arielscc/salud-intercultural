name: CI

on:
  pull_request:
    branches:
      - develop
      - staging
      - main
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  APP_ENV: test
  NEXT_PUBLIC_APP_ENV: test
  DATABASE_ENVIRONMENT: test
  STORAGE_ENVIRONMENT: test
  EXTERNAL_COMMUNICATIONS_MODE: blocked
  DATABASE_URL: postgresql://salud_intercultural:salud_intercultural@127.0.0.1:5432/salud_intercultural_test?schema=public
  PAYLOAD_SECRET: ci-only-non-production-secret
  PAYLOAD_PUBLIC_SERVER_URL: http://localhost:3000
  PAYLOAD_DB_SCHEMA: payload_test
  CMS_READS_DURING_BUILD: "false"
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_PUBLIC_SITE_NAME: Salud Intercultural
  NEXT_PUBLIC_GA_ID: ""
  NEXT_PUBLIC_META_PIXEL_ID: ""

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

  integration-tests:
    name: Integration tests and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: salud_intercultural
          POSTGRES_PASSWORD: salud_intercultural
          POSTGRES_DB: salud_intercultural_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U salud_intercultural -d salud_intercultural_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reset test database, apply migrations and run integration tests
        run: pnpm test:integration

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production application
        run: pnpm run build

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check peer dependencies
        run: pnpm peers check

      - name: Block production high and critical vulnerabilities
        run: pnpm audit:prod

      # GHSA-mh99-v99m-4gvg only reaches brace-expansion through ESLint.
      # Forcing brace-expansion 5 into minimatch 3 breaks lint. Keep this
      # explicit exception until the ESLint plugin chain supports ESLint 10.
      - name: Block all other high and critical vulnerabilities
        run: pnpm audit:high
